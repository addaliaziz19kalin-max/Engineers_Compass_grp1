<header class="header">
  <a class="logo" routerLink="/" aria-label="Engineers Compass — accueil">
    <img class="only-light" src="logo-fonce.png" alt="Engineers Compass">
    <img class="only-dark" src="logo-clair.png" alt="Engineers Compass">
  </a>

  <nav class="nav" aria-label="Navigation principale">
    <a class="link" href="#defis">Défis</a>
    <a class="link" href="#offres">Offres</a>
    <a class="link" href="#communaute">Communauté</a>

    <button
      class="theme-toggle"
      type="button"
      aria-label="Changer de thème"
      [attr.aria-pressed]="theme.isDark()"
      [class.pop]="popping()"
      (click)="toggleTheme()"
      (animationend)="popping.set(false)"
    >
      <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>

    <a class="btn btn-ghost" routerLink="/connexion" appRipple>Se connecter</a>
  </nav>
</header>
